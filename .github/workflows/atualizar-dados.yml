name: Atualizar Dados Futsal Automaticamente

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions: contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar código do repositório
        uses: actions/checkout@v3

      - name: Configurar ambiente Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências necessárias
        run: pip install requests beautifulsoup4

      - name: Executar script de recolha de dados
        run: python scraper.py

      - name: Atualizar o ficheiro JSON no repositório
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add dados.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Atualização automática dos dados da liga [skip ci]" && git push)
